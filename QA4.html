<header><div class="wrap"><h1>👑 QA4｜魔王情境題</h1><p>50題高難度案例判斷｜專攻多條件混合陷阱</p><span class="badge">資料重新核對：2026-08-18｜全國法規資料庫＋勞保局官方資料</span></div></header>
<main class="wrap">
<section class="card"><div class="notice"><b>魔王模式：</b>每題會故意疊兩三個條件。答錯不要只背答案，請看詳解與官方來源。</div></section>
<section id="setup" class="card"><h2 style="margin-top:0">開始挑戰</h2><div class="grid"><div class="field"><label>題數</label><select id="count"><option value="10">10題熱身</option><option value="25">25題</option><option value="50" selected>50題全開</option></select></div><div class="field"><label>分類</label><select id="cat"><option value="全部">全部魔王題</option></select></div><div class="field"><label>順序</label><select id="order"><option value="random">隨機</option><option value="normal">依題庫順序</option></select></div></div><button class="btn" id="start" style="width:100%;margin-top:12px">👑 開始挑戰</button></section>
<section id="quiz" class="card hidden"><div class="row"><span id="ptext" class="muted"></span><b id="scoretxt"></b></div><div class="progress" style="margin:10px 0 14px"><div id="bar"></div></div><span class="tag" id="tag"></span><h2 class="q" id="q"></h2><div class="opts" id="opts"></div><div class="explain hidden" id="exp"></div><div class="nav"><button class="btn ghost" id="quit">提早結束</button><button class="btn" id="next" disabled>下一題</button></div></section>
<section id="result" class="card hidden"><div class="score" id="pct"></div><p id="msg" style="text-align:center"></p><div class="metrics"><div class="metric"><b id="good"></b>答對</div><div class="metric"><b id="bad"></b>答錯</div><div class="metric"><b id="total"></b>總題數</div></div><div style="display:flex;gap:9px;justify-content:center;flex-wrap:wrap"><button class="btn" id="retry">錯題重練</button><button class="btn secondary" id="again">重新設定</button></div><div id="reviews"></div></section>
<section class="card">真實個案仍以勞保局核定為準；每題詳解皆附官方來源。</section>

<script>
const BANK=[{"cat": "A/B魔王", "q": "阿國有35年有效國保年資，沒有欠費、沒有領社福津貼，也沒有其他A式排除情形。2026年65歲時哪個公式較高？", "opts": ["A式，約8,850元", "B式，約9,602元", "兩式相同", "有35年年資只能用A式"], "a": 1, "exp": "A式＝21,103×35×0.65%＋4,049≈8,850元；B式＝21,103×35×1.3%≈9,602元。沒有排除情形時是兩式擇優，不是固定選A。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "A/B魔王", "q": "阿美64歲6個月時有國保欠費，收到勞保局書面限期通知後仍逾期才繳清。65歲後老年年金最精確的說法是？", "opts": ["終身只能B式", "前3個月按B式；之後再按當時是否符合A式擇優條件處理", "停發3個月", "欠費既已繳清，完全不影響"], "a": 1, "exp": "事故前1年欠費，經書面限期仍逾期才繳，依法得領的前3個月老年年金按B式。不是終身B式。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "A/B魔王", "q": "阿明有一段國保欠費已超過10年，不能補繳且該期間不能計入年資；其他部分有有效年資。65歲時怎麼算國保老年年金？", "opts": ["全部國保年資歸零", "仍可用有效年資請領，但不得用A式，按B式", "固定4,049元", "因有欠費所以完全不能領"], "a": 1, "exp": "有欠繳保費期間不能計入年資時，屬A式排除條件；其他有效年資仍可按規定計算。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "A/B魔王", "q": "65歲的阿華同時符合國保老年年金資格，但正在領老年農民福利津貼。就國保A/B式而言，下列何者正確？", "opts": ["因為是農民，所以一定A式", "老農津貼屬法定社會福利津貼，原則不得選A式", "老農津貼和國保完全無關", "只能領老年基本保證年金"], "a": 1, "exp": "老年農民福利津貼屬國民年金法所稱相關社會福利津貼，正在領取者屬A式排除情形。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "第7條魔王", "q": "某人在國保施行前已領取公保養老給付，符合第7條第2款過渡納保條件。65歲後，在以3,000元按月累計尚未達原領給付總額前，國保老年年金如何？", "opts": ["仍可自由A/B擇優", "不得使用A式", "不能領任何國保老年年金", "固定只領3,000元"], "a": 1, "exp": "這段期間屬A式排除。3,000元是累計判斷用，不是國保固定每月只發3,000元。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "第7條魔王", "q": "國保施行前領過勞保老年給付，在第7條第2款的15年／50萬元門檻判斷中，勞保老年給付的年資或金額如何處理？", "opts": ["全部列入", "只列入金額", "只列入年資", "不列入該款門檻計算"], "a": 3, "exp": "第7條第2款明定，國保施行前所領取的勞工保險老年給付年資或金額不列入該款門檻計算。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "第7條魔王", "q": "某人在112年10月1日後才領取相關社會保險老年給付，當時未滿65歲。何者正確？", "opts": ["只要年資未滿15年就可繼續國保", "只要一次給付未滿50萬就可繼續國保", "不論年資或金額，都不得再參加國保", "只有公保會影響國保"], "a": 2, "exp": "112/10/1起第7條第3款過渡期退場，領取相關社會保險老年給付者，不論年資或金額均不得再參加國保。", "src": "https://www.bli.gov.tw/0108085.html"}, {"cat": "第7條魔王", "q": "承上題，該人在退出國保前已累積12年有效國保年資。65歲時這12年怎麼處理？", "opts": ["全部作廢", "仍保留，國保老年年金按B式計給", "只能退回12年保費", "改成老年基本保證年金"], "a": 1, "exp": "既有有效國保年資保留；65歲時仍可請領國保老年年金，但依112/10/1後規則按B式計給。", "src": "https://www.bli.gov.tw/0108085.html"}, {"cat": "國勞雙年金", "q": "王女士勞保年資7年、國保有效年資12年，65歲時想領年金。最正確的觀念是？", "opts": ["兩種年資合併成19年，用一個公式算", "可併計判斷15年門檻，但勞保與國保仍依各自年資分別計算", "國保12年必須轉入勞保", "只能領一次給付"], "a": 1, "exp": "年資可併計判斷資格門檻，但兩種保險仍按各自年資及公式分別計算。", "src": "https://www.bli.gov.tw/0108085.html"}, {"cat": "A/B魔王", "q": "某人正在領勞保老年年金，另外還有10年國保年資。65歲時國保部分通常如何？", "opts": ["國保A/B擇優", "國保按B式", "國保固定4,049元", "因領勞保年金，國保年資作廢"], "a": 1, "exp": "領取勞保老年年金是現行A式排除情形，既有國保年資仍可按B式計算。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "A/B魔王", "q": "某人同時符合國保老年年金與遺屬年金請領條件，可以兩項完整同時領嗎？", "opts": ["可以", "不可以，依法僅得擇一", "只要65歲就可全領", "低收入戶才可全領"], "a": 1, "exp": "身障、老年、基本保證及遺屬等特定年金同時符合時，依法僅得擇一請領。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "納保邊界", "q": "26歲服替代役、在國內設有戶籍，沒有參加勞保等其他社會保險。是否因有「替代役保險」就排除國保？", "opts": ["是，替代役保險等同軍保", "否，替代役保險不是軍保，符合條件仍應參加國保", "只有自願役才參加國保", "必須等退役才加國保"], "a": 1, "exp": "勞保局明確說明，替代役保險並非軍人保險；符合其他國保資格時仍應參加國保。", "src": "https://www.bli.gov.tw/0013590.html"}, {"cat": "納保邊界", "q": "30歲國民長期旅居海外，超過2年未持本國護照入境，戶籍已遷出國外。這段期間國保如何？", "opts": ["仍強制國保", "不屬國保被保險人；恢復戶籍且符合資格後可再納保", "國保年資全部消失", "必須繼續繳到65歲"], "a": 1, "exp": "戶籍遷出國外期間不屬國保被保險人；恢復戶籍且符合資格後可再參加，既有年資依規定併計。", "src": "https://www.bli.gov.tw/0013590.html"}, {"cat": "納保邊界", "q": "某人國保退保3年後又重新符合國保資格。之前已繳的有效國保年資怎麼辦？", "opts": ["歸零重算", "前後保險年資應予併計", "只能保留一半", "只有連續加保才算"], "a": 1, "exp": "國民年金法第9條明定，退保後再參加者，其保險年資應予併計。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "保費魔王", "q": "某月只符合國保資格10天，保費計算原則為何？", "opts": ["仍算完整1個月", "按實際加保10日，以每月30日比率計算", "不滿15天不用繳", "按31天比例"], "a": 1, "exp": "未全月加保時依實際加保日數，按每月30日比率計算。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "保費魔王", "q": "國保被保險人想一次預繳未來3年的保險費，可以嗎？", "opts": ["可以，無上限", "不可以；預繳期間以1年為限", "只能預繳6個月", "低收入戶才可預繳3年"], "a": 1, "exp": "國民年金法第13條規定，預繳保險費期間以1年為限。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "生育魔王", "q": "女性在國保有效期間懷孕，之後因就業退保，退保11個月後因同一懷孕事故分娩，且沒有領其他社會保險生育給付。是否可能領國保生育給付？", "opts": ["不可能", "可以，符合退保後1年內同一懷孕事故的放寬規定", "只有退保3個月內可以", "只有早產才可以"], "a": 1, "exp": "在國保有效期間懷孕，退保後1年內因同一懷孕事故分娩或早產，且未領其他社會保險生育給付，仍可申請。", "src": "https://www.bli.gov.tw/0017701.html"}, {"cat": "生育魔王", "q": "同樣是在國保期間懷孕，但退保後1年2個月才分娩，且分娩時也沒有重新加入國保。僅就「退保後例外」而言如何？", "opts": ["仍可，無期限", "已超過退保後1年的例外期間", "只要曾繳過國保就可", "可領一半"], "a": 1, "exp": "退保後放寬規定是1年內；超過1年就不符合這項例外。", "src": "https://www.bli.gov.tw/0017701.html"}, {"cat": "生育魔王", "q": "先生是國保被保險人，但太太沒有參加國保。太太生產時，先生可用自己的國保資格申請生育給付嗎？", "opts": ["可以", "不可以，須由符合條件的女性被保險人本人請領", "只可領一半", "只有第一胎不可以"], "a": 1, "exp": "國保生育給付不是配偶生育津貼，核心是女性被保險人本人分娩／早產或符合退保後懷孕例外。", "src": "https://www.bli.gov.tw/0104477.html"}, {"cat": "生育魔王", "q": "2026年符合國保生育給付與加給補助資格，生三胞胎，合計原則可達多少？", "opts": ["10萬元", "20萬元", "30萬元", "42萬2,060元"], "a": 2, "exp": "每胎合計補足10萬元，三胞胎為30萬元。", "src": "https://www.bli.gov.tw/0109942.html"}, {"cat": "生育魔王", "q": "同一次分娩同時符合勞保與國保生育給付，最正確的說法是？", "opts": ["兩邊都完整領", "僅得擇一請領", "一定只能選國保", "先申請哪個都能再補另一個"], "a": 1, "exp": "同一分娩或早產事故同時符合國保與相關社會保險生育給付或補助時，依法僅得擇一。", "src": "https://www.bli.gov.tw/0109942.html"}, {"cat": "生育魔王", "q": "被保險人申請國保生育給付，同時已依規定辦理欠費分期或延期繳納。法律對已繳納金額有何要求？", "opts": ["完全不用先繳", "已繳金額不得低於給付總額的一半", "必須先繳清全部", "只需先繳10%"], "a": 1, "exp": "國民年金法第32條之1規定，已辦理分期或延期繳費者，申請生育給付時已繳納金額不得低於給付總額的一半。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "身障魔王", "q": "國保有效期間發生傷病，經治療後被診斷為重度以上身障且評估無工作能力，最可能屬於哪一制度？", "opts": ["身心障礙年金", "身心障礙基本保證年金", "老年基本保證年金", "原住民給付"], "a": 0, "exp": "傷病發生於國保期間並達法定重度以上、無工作能力等條件，屬身心障礙年金的核心情境。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "身障魔王", "q": "加入國保前就已符合重度以上身障且無工作能力，加入後符合居住、排富等條件。最可能申請哪一項？", "opts": ["一般身障年金", "身心障礙基本保證年金", "喪葬給付", "遺屬年金"], "a": 1, "exp": "參加國保前已符合重度以上且無工作能力者，若符合其他福利條件，可能適用身心障礙基本保證年金。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "身障魔王", "q": "某人國保有效年資10年，身障年金公式算約2,743元，且沒有任何基本保障排除情形。2026每月應以哪個標準較接近？", "opts": ["2,743元", "4,049元", "5,437元", "21,103元"], "a": 2, "exp": "21,103×10×1.3%≈2,743元；低於現行基本保障5,437元且無排除情形時，按5,437元發給。", "src": "https://www.bli.gov.tw/0017725.html"}, {"cat": "身障魔王", "q": "承上題，但該人有欠繳保費期間不能計入年資。公式仍約2,743元。可否補到5,437元？", "opts": ["可以，所有人都有最低5,437元", "不可以，這是基本保障排除情形之一", "改補到4,049元", "只要補繳1天即可"], "a": 1, "exp": "有欠繳保費期間不能計入年資，是身障年金基本保障的排除情形。", "src": "https://www.bli.gov.tw/0017725.html"}, {"cat": "身障魔王", "q": "請領國保身障年金者另有勞保年資，尚未領過勞保老年給付或特定終身失能給付。最正確的說法是？", "opts": ["勞保年資永遠不能用", "可選擇由兩種保險分別核算後合併發給；選擇併計或不併計後不能任意變更", "直接把勞保年資乘國保1.3%", "一定改領勞保"], "a": 1, "exp": "符合條件時可選擇併計，國保與勞保仍各依自己的公式核算後合併發給。", "src": "https://www.bli.gov.tw/0014353.html"}, {"cat": "身障魔王", "q": "某人已領過勞保老年給付，之後申請國保身障年金。以前那段勞保年資可否再拿來併計身障年金？", "opts": ["可以，年資可重複使用", "不可以", "只可併一半", "65歲後才可以"], "a": 1, "exp": "已領過勞保老年給付的年資，不能再拿來併計國保身障年金。", "src": "https://www.bli.gov.tw/0014353.html"}, {"cat": "基本保證魔王", "q": "老年基本保證年金的主要對象是？", "opts": ["所有65歲以上國民", "97年10月1日國保施行時已滿65歲，並符合其他資格者", "國保年資滿15年者", "所有領勞保退休金者"], "a": 1, "exp": "老年基本保證年金是國保開辦時既有高齡者的過渡保障。", "src": "https://www.bli.gov.tw/0014340.html"}, {"cat": "基本保證魔王", "q": "申請老年基本保證年金時，「最近3年每年居住超過183天」最正確的理解是？", "opts": ["3年合計183天即可", "每一個往前檢視的年度區段都要超過183天，而且會滾動檢視36個月", "只看申請當年", "有戶籍就不看日數"], "a": 1, "exp": "官方說明是每期核發往前36個月，3個年度區段各自都要超過183天。", "src": "https://www.bli.gov.tw/0014340.html"}, {"cat": "基本保證魔王", "q": "申請基本保證年金者銀行存款有80萬元，但財稅機關提供的個人綜合所得未達50萬元。僅就50萬元所得排富而言，何者正確？", "opts": ["銀行存款80萬就等於所得80萬", "50萬元看的是公告年度個人綜合所得，不是單純銀行存款餘額", "任何存款都不審查", "只要有定存就失格"], "a": 1, "exp": "50萬元門檻是財稅機關提供的個人綜合所得稅各類所得總額，不是直接看銀行帳戶餘額。", "src": "https://www.bli.gov.tw/0013618.html"}, {"cat": "基本保證魔王", "q": "某人只有一間自己實際居住的房屋及土地，公告現值／評定標準合計700萬元，沒有其他不動產。符合唯一自住扣除條件時，僅就500萬元排富怎麼看？", "opts": ["700萬一定失格", "可扣最高400萬，剩300萬，僅就此財產門檻未達500萬", "全部700萬都不計", "固定扣500萬"], "a": 1, "exp": "唯一房屋且實際居住可扣最高400萬元；700－400＝300萬元。", "src": "https://www.bli.gov.tw/0014340.html"}, {"cat": "原住民魔王", "q": "58歲原住民目前受僱於民營公司，但每月工作總收入未超過勞保投保薪資分級表第1級，其他條件均符合。原住民給付如何？", "opts": ["只要有工作就一定失格", "仍可能符合，低於該收入門檻有例外", "必須辭職滿1年", "只能領一半"], "a": 1, function start(custom=null){let pool=custom||BANK.filter(x=>$('cat').value==='全部'||x.cat===$('cat').value);if(!custom&&$('order').value==='random')pool=shuffle(pool);let n=Math.min(+$('count').value,pool.length);qs=custom?[...custom]:pool.slice(0,n);i=score=0;answers=[];$('setup').classList.add('hidden');$('result').classList.add('hidden');$('quiz').classList.remove('hidden');render()}
function render(){done=false;let x=qs[i];$('next').disabled=true;$('next').textContent=i===qs.length-1?'看成績':'下一題';$('ptext').textContent=`第 ${i+1} / ${qs.length} 題`;$('scoretxt').textContent=`答對 ${score} 題`;$('bar').style.width=`${(i+1)/qs.length*100}%`;$('tag').textContent=x.cat;$('q').textContent=x.q;$('exp').classList.add('hidden');$('opts').innerHTML='';x.opts.forEach((t,k)=>{let b=document.createElement('button');b.className='opt';b.innerHTML=`<b>${L[k]}</b>${t}`;b.onclick=()=>choose(k);$('opts').appendChild(b)});window.scrollTo({top:0,behavior:'smooth'})}
function choose(k){if(done)return;done=true;let x=qs[i],ok=k===x.a;if(ok)score++;answers.push({x,k,ok});[...$('opts').children].forEach((b,j)=>{b.disabled=true;if(j===x.a)b.classList.add('correct');if(j===k&&j!==x.a)b.classList.add('wrong')});$('scoretxt').textContent=`答對 ${score} 題`;$('exp').innerHTML=`<div class="ans">${ok?'✓ 答對':'正確答案：'+L[x.a]+'．'+x.opts[x.a]}</div>${x.exp}<div class="source">官方來源：<a href="${x.src}" target="_blank" rel="noopener">查看官方資料</a></div>`;$('exp').classList.remove('hidden');$('next').disabled=false}
function finish(){$('quiz').classList.add('hidden');$('result').classList.remove('hidden');let total=answers.length;if(!total){location.reload();return}let p=Math.round(score/total*100),wrong=answers.filter(a=>!a.ok);$('pct').textContent=p+'%';$('good').textContent=score;$('bad').textContent=wrong.length;$('total').textContent=total;$('msg').textContent=p>=90?'魔王級很穩。':p>=75?'很接近了，重刷錯題即可。':p>=60?'基本概念有，但多條件題仍容易被帶走。':'先回QA2補特殊規則，再回來挑戰。';$('retry').disabled=!wrong.length;$('retry').textContent=wrong.length?`錯題重練（${wrong.length}題）`:'本回全對';$('reviews').innerHTML=wrong.length?'<h2>錯題詳解</h2>':'';wrong.forEach((a,n)=>{let d=document.createElement('div');d.className='review';d.innerHTML=`<b>${n+1}. ${a.x.q}</b><br><span style="color:var(--bad)">你的答案：${L[a.k]}．${a.x.opts[a.k]}</span><br><span style="color:var(--ok);font-weight:800">正確：${L[a.x.a]}．${a.x.opts[a.x.a]}</span><p>${a.x.exp}</p><a href="${a.x.src}" target="_blank" rel="noopener">官方來源</a>`;$('reviews').appendChild(d)});window.scrollTo({top:0,behavior:'smooth'})}
$('start').onclick=()=>start();$('next').onclick=()=>{if(i<qs.length-1){i++;render()}else finish()};$('quit').onclick=finish;$('again').onclick=()=>{$('result').classList.add('hidden');$('quiz').classList.add('hidden');$('setup').classList.remove('hidden');window.scrollTo({top:0,behavior:'smooth'})};$('retry').onclick=()=>start(answers.filter(a=>!a.ok).map(a=>a.x));
</script></body></html>
