<body><header><div class="wrap"><h1>QA3｜國民年金問答題</h1><p>50題情境問答｜先自己回答，再按顯示答案｜可標記「我會了」</p><span class="badge">資料核對基準：2026-08-18｜手機版可直接刷題</span></div></header>
<main class="wrap">
<section class="card"><div class="notice"><b>建議玩法：</b>先不要點答案，用自己的話完整回答；再按「顯示答案」比對。這頁刻意把A/B式特例、第7條第2、3款、原住民、生育、身障、喪葬與遺屬做成口頭申論題。</div></section>
<section class="card"><div class="toolbar">
<div class="field"><label>搜尋題目</label><input id="search" placeholder="例如：A式、原住民、喪葬"></div>
<div class="field"><label>分類</label><select id="cat"><option value="全部">全部</option></select></div>
<button class="btn secondary" id="random">隨機一題</button><button class="btn ghost" id="reset">清除進度</button>
</div><div class="row" style="margin-top:12px"><span id="shown" class="muted"></span><span class="counter" id="learnedCount"></span></div></section>
<section id="list"></section>
<section class="card sources"><h2 style="color:var(--text);margin-top:0">資料來源</h2><p>每題答案下方都有官方法規或勞保局連結。核心法源為現行《國民年金法》，現行給付金額以2026勞保局公告標準整理。</p></section>
</main>
<script>
const BANK=[{"cat": "A/B式特殊", "q": "請寫出2026現行國保老年年金A式與B式公式。", "a": "A式＝月投保金額×國保保險年資×0.65%＋4,049元；B式＝月投保金額×國保保險年資×1.3%。沒有A式排除情形時，兩式擇優計給。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "A/B式特殊", "q": "為什麼不能直接認為A式一定比B式高？", "a": "A式雖固定加4,049元，但年資係數只有0.65%；B式係數是1.3%。年資越長，B式增加得越快。以2026月投保金額21,103元單純比較公式，約30年左右B式可能超過A式。", "src": "https://www.bli.gov.tw/0014336.html"}, {"cat": "A/B式特殊", "q": "請列出老年年金不得使用A式的三大核心類型。", "a": "可先背三大類：①有欠繳保費期間不能計入保險年資；②正在領取國民年金法所稱相關社會福利津貼；③已領取相關社會保險老年給付。第③類另有第7條第2、3款歷史過渡例外。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "A/B式特殊", "q": "若被保險人在64～65歲期間欠費，勞保局書面限期繳納後仍逾期才繳清，老年年金會有什麼影響？", "a": "依法可領取的前3個月老年年金按B式計算。重點是事故前1年欠費、經書面限期仍逾期後才繳，不是只要曾晚繳就終身只能B式。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "A/B式特殊", "q": "國保欠費超過10年為什麼會影響A式？", "a": "超過10年的欠費原則上不能再補繳，也不能計入保險年資；一旦形成「欠繳保險費期間不能計入保險年資」的情形，老年年金不得使用A式，只能按B式計算。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "第7條特例", "q": "國民年金法第7條第2款主要在處理哪一類歷史過渡對象？", "a": "處理國保97/10/1施行前已領相關社會保險老年給付者。若相關年資合計未達15年，或一次給付總額未達50萬元，可符合該款；其中國保施行前領取的勞保老年給付年資或金額不列入該門檻計算。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "第7條特例", "q": "國民年金法第7條第3款主要在處理哪一類歷史過渡對象？", "a": "處理國保施行後15年內，也就是大致97/10/1至112/9/30期間領取相關社會保險老年給付者。符合年資未達15年或一次給付總額未達50萬元等條件者，可依該款納保；另有98/1/1前勞保老年給付不列入部分門檻計算的特例。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "第7條特例", "q": "112年10月1日起，領取勞保、公保或軍保相關老年給付的人，國保納保規則有什麼重大改變？", "a": "自112/10/1（含）起才領取相關社會保險老年給付者，不論年資長短或給付金額多寡，都不得再參加國保；原已參加者會退出。", "src": "https://www.bli.gov.tw/0108917.html"}, {"cat": "第7條特例", "q": "因112年10月1日後領取其他社會保險老年給付而退出國保，之前累積的國保年資會消失嗎？", "a": "不會。原有有效國保年資仍保留；到65歲時仍可請領國保老年年金，但依112/10/1後現行規則，這類既有國保年資按B式計給。退出國保後若在非國保有效期間發生身障或死亡事故，相關保障也可能不同。", "src": "https://www.bli.gov.tw/0108917.html"}, {"cat": "A/B式特殊", "q": "已領勞保老年年金，另有國保年資，65歲請領國保老年年金時原則採哪一式？", "a": "國保老年年金原則按B式計算。勞保局的國保＋勞保雙年金案例也明確說明，已領勞保老年年金者的國保部分以B式計給。", "src": "https://www.bli.gov.tw/0014339.html"}, {"cat": "A/B式特殊", "q": "98年1月1日至112年9月30日期間領勞保老年一次給付，什麼情況仍可能使用國保A式？", "a": "若該次給付的年資未達15年，或一次給付金額未達50萬元，而且沒有其他不得用A式的情形，國保老年年金仍可能按A式與B式擇優。", "src": "https://www.bli.gov.tw/0017687.html"}, {"cat": "A/B式特殊", "q": "98年1月1日至112年9月30日期間領勞保老年一次給付，年資超過15年且一次給付金額也超過50萬元，國保老年年金原則如何？", "a": "原則按B式計算。這題常用「或／且」設陷阱；官方FAQ的高門檻情境是年資超過15年而且一次給付金額超過50萬元。", "src": "https://www.bli.gov.tw/0017687.html"}, {"cat": "A/B式特殊", "q": "第7條第2、3款被保險人若曾領公保養老給付或軍保退伍給付，何時可能不再受到A式限制？", "a": "依第30條特例，自65歲當月起以3,000元按月累計，當累計金額達原領取的公保養老給付或軍保退伍給付總額後，才可不受該項A式限制；仍須確認沒有其他排除情形。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "國勞雙年金", "q": "勞保年資未滿15年，國保年資可以怎麼幫忙？", "a": "年滿65歲時，勞保年資未滿15年者，可以併計國保有效年資判斷是否達15年年金資格門檻；但最後國保與勞保仍依各自年資、各自法規分別計算與發給。", "src": "https://www.bli.gov.tw/0014339.html"}, {"cat": "老年基本保證", "q": "一般國保老年年金與老年基本保證年金最大的不同是什麼？", "a": "一般老年年金是曾參加國保、有有效年資者在65歲後依A/B式計算；老年基本保證年金主要保障國保97/10/1施行時已滿65歲的既有高齡者，屬特定過渡性福利，另有居住、所得與財產條件。", "src": "https://www.bli.gov.tw/0014340.html"}, {"cat": "老年基本保證", "q": "老年基本保證年金的居住條件怎麼背？", "a": "在國內設有戶籍，而且最近3年內每年在國內居住超過183日。不是3年合計183日；實務上會隨每月核發往前滾動檢視。", "src": "https://www.bli.gov.tw/0014340.html"}, {"cat": "老年基本保證", "q": "老年基本保證年金現行最重要的所得與不動產排富門檻是多少？", "a": "個人綜合所得稅各類所得總額合計達50萬元以上，或個人所有土地及房屋價值合計達500萬元以上，原則屬排除條件；符合規定的唯一自住房屋且實際居住，可依法扣除最高400萬元。", "src": "https://www.bli.gov.tw/0014340.html"}, {"cat": "老年基本保證", "q": "領老年基本保證年金的人死亡，家屬可以因此請領國保遺屬年金嗎？", "a": "不可以。要和「正在領一般國保老年年金者死亡，遺屬年金可按原年金半數為基本計算」區分。", "src": "https://www.bli.gov.tw/0014363.html"}, {"cat": "原住民給付", "q": "原住民給付是國保五大保險給付之一嗎？它的性質是什麼？", "a": "不是五大保險給付之一。原住民給付屬福利津貼性質，不以曾繳國保保費為前提，但有年齡、戶籍、所得、財產及其他排除條件。", "src": "https://www.bli.gov.tw/0017695.html"}, {"cat": "原住民給付", "q": "2026現行原住民給付的年齡與金額是多少？", "a": "符合條件者自年滿55歲起領到65歲前一個月；現行每月4,049元。", "src": "https://www.bli.gov.tw/0017695.html"}, {"cat": "原住民給付", "q": "55歲原住民仍在公民營事業工作，就一定不能領原住民給付嗎？", "a": "不一定。原則上現職軍公教及公民營事業人員屬排除，但若每月工作總收入未超過勞保投保薪資分級表第1級，則不受這一項限制。", "src": "https://www.bli.gov.tw/0017695.html"}, {"cat": "原住民給付", "q": "請說出原住民給付至少4種常見不能領的情形。", "a": "例如：領特定月退休金或軍人退休俸；正在領身心障礙者生活補助或榮民就養給付；政府全額補助收容安置；個人所得達50萬元；房地價值達500萬元且無法定扣除；入獄服刑、羈押或拘禁等。", "src": "https://www.bli.gov.tw/0017695.html"}, {"cat": "原住民給付", "q": "原住民給付的房地500萬元門檻，有哪些常見可扣除項目？", "a": "常見包括尚未徵收補償的公共設施保留地、符合規定的非都市交通用地、唯一房屋且實際居住（最高扣400萬元），以及未產生經濟效益的原住民保留地。", "src": "https://www.bli.gov.tw/0017695.html"}, {"cat": "原住民給付", "q": "原住民滿65歲後還能繼續領原住民給付嗎？", "a": "不能。原住民給付只發到年滿65歲前一個月；65歲後若有國保年資或符合其他制度資格，改依相應規定處理。", "src": "https://www.bli.gov.tw/0017695.html"}, {"cat": "生育給付", "q": "國保生育給付的基本資格，除了在加保期間分娩或早產外，還有什麼退保後例外？", "a": "如果女性在國保有效期間已懷孕，退保後1年內因同一懷孕事故分娩或早產，而且未領其他社會保險生育給付，仍可依規定請領國保生育給付。", "src": "https://www.bli.gov.tw/0017701.html"}, {"cat": "生育給付", "q": "2026國保生育給付的法定本體是多少？", "a": "按分娩或早產時的月投保金額一次發給2個月。2026月投保金額為21,103元，所以法定生育給付本體為42,206元。", "src": "https://www.bli.gov.tw/0017701.html"}, {"cat": "生育給付", "q": "2026為什麼國保生育會看到「每胎10萬元」？雙胞胎呢？", "a": "115/1/1後另由公務預算補助，使符合條件者每胎「生育給付＋補助」合計補足10萬元。雙胞胎20萬元，三胞胎30萬元，依胎數比例增給。", "src": "https://www.bli.gov.tw/0109851.html"}, {"cat": "生育給付", "q": "同一次分娩同時符合國保與其他社會保險生育給付，可以全部重複領嗎？", "a": "不可以。同一分娩或早產事故同時符合國保與相關社會保險生育給付或補助條件者，僅得擇一請領。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "生育給付", "q": "國保生育給付5年請求權時效從什麼時候開始算？", "a": "自分娩或早產次日起算5年。超過5年才申請，原則上會因請求權時效消滅而不予給付。", "src": "https://www.bli.gov.tw/0017701.html"}, {"cat": "生育給付", "q": "死產能不能請國保生育給付？", "a": "符合分娩或早產等規定時，不論活產或死產都可能符合生育給付資格；申請時仍須依規定檢附相關醫療證明。", "src": "https://www.bli.gov.tw/0016966.html"}, {"cat": "生育給付", "q": "國保所稱「早產」大致如何判斷？", "a": "原則為妊娠週數達20週（含140天）但未滿37週（不含259天）；若週數不明，可參考胎兒出生體重大於500公克且少於2,500公克。", "src": "https://www.bli.gov.tw/0016966.html"}, {"cat": "身心障礙", "q": "身心障礙年金與身心障礙基本保證年金最核心的差別是什麼？", "a": "身心障礙年金：傷病發生於國保有效期間，最後符合重度以上且經評估無工作能力等條件。身心障礙基本保證年金：參加國保前就已符合重度以上且無工作能力，另有居住、所得、財產及福利排除條件。", "src": "https://www.bli.gov.tw/0017709.html"}, {"cat": "身心障礙", "q": "2026現行身心障礙年金如何計算？最低基本保障是多少？", "a": "基本公式＝月投保金額×國保保險年資×1.3%。公式結果低於現行5,437元，而且沒有不得適用基本保障的情形時，可按5,437元發給。", "src": "https://www.bli.gov.tw/0017725.html"}, {"cat": "身心障礙", "q": "為什麼不能說每位身障年金請領人至少都一定有5,437元？", "a": "因為最低基本保障有排除情形。例如有欠繳保費期間不能計入年資，或正在領取國民年金法所稱相關社會福利津貼，就不得用最低保障補足。", "src": "https://www.bli.gov.tw/0017725.html"}, {"cat": "身心障礙", "q": "身障事故前1年欠費，收到書面限期後仍逾期才繳，前3個月身障年金如何計算？", "a": "前3個月只按「月投保金額×年資×1.3%」公式發給，不適用5,437元基本保障補足。", "src": "https://www.bli.gov.tw/0017725.html"}, {"cat": "身心障礙", "q": "身心障礙基本保證年金有哪些重要居住與排富條件？", "a": "請領前3年內每年在國內居住超過183天；另有不得政府全額收容安置、不得同時領特定社福、個人所得未達50萬元、房地價值未達500萬元（有法定扣除）等條件。", "src": "https://www.bli.gov.tw/0017709.html"}, {"cat": "身心障礙", "q": "身心障礙年金是不是只要持有身障證明就能領？", "a": "不是。國保身心障礙年金核心還包括符合重度以上身心障礙，以及經評估無工作能力等法定條件；不能把「身障保費補助」與「身障年金請領資格」混為一談。", "src": "https://www.bli.gov.tw/0017709.html"}, {"cat": "喪葬給付", "q": "國保喪葬給付的請領人與死亡時點條件是什麼？", "a": "被保險人必須在國保有效期間死亡，由實際支出殯葬費的人請領；並不是固定由配偶或法定繼承人請領。", "src": "https://www.bli.gov.tw/0017731.html"}, {"cat": "喪葬給付", "q": "2026國保喪葬給付多少？怎麼算？", "a": "按死亡當月月投保金額一次發給5個月。2026月投保金額21,103元，所以21,103×5＝105,515元。", "src": "https://www.bli.gov.tw/0017731.html"}, {"cat": "喪葬給付", "q": "被保險人65歲後才死亡，為什麼通常不能請國保喪葬給付？", "a": "因為喪葬給付要求死亡時仍是國保被保險人。一般國保納保至未滿65歲，65歲後死亡時已非國保有效期間的被保險人，因此不符合這項喪葬給付條件。", "src": "https://www.bli.gov.tw/0017731.html"}, {"cat": "喪葬給付", "q": "多人都實際支出殯葬費且同時申請，協議不成時怎麼處理？", "a": "原則以一人請領為限；勞保局會通知申請人協議一人代表請領。若協議不成，依法律規定平均發給各申請人，而不是每個人各領一份完整5個月給付。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "遺屬年金", "q": "國保遺屬年金有哪3種主要死亡情境？各自基本公式是什麼？", "a": "①被保險人在國保有效期間死亡：月投保金額×年資×1.3%；②正在領身障（含基本保證）或老年年金期間死亡：原年金的1/2；③已滿65歲符合老年年金資格但未及請領前死亡：月投保金額×年資×1.3%×50%。", "src": "https://www.bli.gov.tw/0014364.html"}, {"cat": "遺屬年金", "q": "遺屬年金請領順位怎麼背？", "a": "第1順位配偶及子女；第2父母；第3祖父母；第4孫子女；第5兄弟姊妹。可背「配子、父母、祖、孫、兄姊」。", "src": "https://www.bli.gov.tw/0014363.html"}, {"cat": "遺屬年金", "q": "前順位遺屬存在，但不符合資格或自願放棄，後順位可以遞補嗎？", "a": "不可以。只要當序的前順位遺屬存在，後順位就不得請領，即使前順位不符資格或放棄也一樣；前順位日後死亡或失去資格，也不會因此再轉給後順位。", "src": "https://www.bli.gov.tw/0014363.html"}, {"cat": "遺屬年金", "q": "配偶請領國保遺屬年金有哪些常見資格路徑？", "a": "常見包括：年滿55歲且婚姻存續1年以上；或年滿45歲且婚姻存續1年以上、月工作收入未超過基本工資；另有扶養符合條件子女或無謀生能力等例外。", "src": "https://www.bli.gov.tw/0014363.html"}, {"cat": "遺屬年金", "q": "子女與養子女請領遺屬年金有哪些常見資格？", "a": "子女須符合未成年、無謀生能力，或25歲以下在學且月工作收入未超過基本工資之一；養子女另要求收養關係存續6個月以上。", "src": "https://www.bli.gov.tw/0014363.html"}, {"cat": "遺屬年金", "q": "同順位有2人、3人以上時，遺屬年金怎麼加發？目前基本保障是多少？", "a": "同順位2人以上，每多1人加發25%，最多加發50%；因此2人為125%，3人以上達150%上限。符合基本保障條件且公式不足時，2026現行最低為4,049元。", "src": "https://www.bli.gov.tw/0014364.html"}, {"cat": "遺屬年金", "q": "國保遺屬年金的5年請求權要注意什麼？", "a": "國保給付原則有5年請求權時效。遺屬年金依法可就符合規定的期間追溯，但仍受5年時效及已由其他受益人領取部分等限制，實際由勞保局依申請時點核定。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "通則", "q": "同一人如果同時符合身障年金、身障基本保證、老年年金、老年基本保證或遺屬年金，可以全部一起領嗎？", "a": "不可以。國民年金法第21條規定，符合這些年金給付條件時僅得擇一請領。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}, {"cat": "通則", "q": "國保保險給付的一般請求權時效與欠費可補繳期間，各是多少？", "a": "保險給付請求權原則5年；欠繳國保保費原則10年內可補繳。可背口訣「欠10、給5」。", "src": "https://law.moj.gov.tw/LawClass/LawAll.aspx?pcode=D0050152"}]; const $=x=>document.getElementById(x); let learned=new Set(JSON.parse(localStorage.getItem('qa3Learned2026')||'[]'));
[...new Set(BANK.map(x=>x.cat))].forEach(c=>{let o=document.createElement('option');o.value=o.textContent=c;$('cat').appendChild(o)});
function save(){localStorage.setItem('qa3Learned2026',JSON.stringify([...learned]));}
function render(forceIndex=null){let s=$('search').value.trim().toLowerCase(),c=$('cat').value;let arr=BANK.map((x,i)=>({...x,i})).filter(x=>(c==='全部'||x.cat===c)&&(!s||x.q.toLowerCase().includes(s)||x.a.toLowerCase().includes(s)));if(forceIndex!==null)arr=arr.filter(x=>x.i===forceIndex);$('shown').textContent=`目前顯示 ${arr.length} / ${BANK.length} 題`;$('learnedCount').textContent=`已會：${learned.size} / ${BANK.length}`;$('list').innerHTML='';arr.forEach((x,n)=>{let d=document.createElement('article');d.className='qaItem'+(learned.has(x.i)?' learned':'');d.innerHTML=`<div class="qaHead"><span class="tag">${x.cat}</span><h3>${forceIndex!==null?'隨機題':'第 '+(x.i+1)+' 題'}｜${x.q}</h3></div><div class="qaActions"><button class="btn secondary reveal">顯示答案</button><button class="btn ghost know">${learned.has(x.i)?'✓ 已會':'我會了'}</button></div><div class="answer hidden"><b>參考答案</b><br>${x.a}<div class="source">官方來源：<a href="${x.src}" target="_blank" rel="noopener">查看官方資料</a></div></div>`;d.querySelector('.reveal').onclick=e=>{let a=d.querySelector('.answer');a.classList.toggle('hidden');e.currentTarget.textContent=a.classList.contains('hidden')?'顯示答案':'收起答案'};d.querySelector('.know').onclick=()=>{if(learned.has(x.i))learned.delete(x.i);else learned.add(x.i);save();render(forceIndex)};$('list').appendChild(d)})}
$('search').oninput=()=>render();$('cat').onchange=()=>render();$('random').onclick=()=>{let pool=BANK.map((x,i)=>i).filter(i=>$('cat').value==='全部'||BANK[i].cat===$('cat').value);if(!pool.length)return;let k=pool[Math.floor(Math.random()*pool.length)];$('search').value='';render(k);window.scrollTo({top:$('list').offsetTop-10,behavior:'smooth'})};$('reset').onclick=()=>{if(confirm('確定清除「已會」進度嗎？')){learned.clear();save();render()}};render();
</script></body></html>
